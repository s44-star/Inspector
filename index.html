<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0A0C;font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{height:0}to{}}
@keyframes goldline{from{width:0}to{width:100%}}
@keyframes ldr{0%{left:-40%}100%{left:100%}}
.panel-in{animation:fadeUp .4s ease both}
.modal-in{animation:modalIn .25s ease both}
.row-hover{transition:background .15s}
.row-hover:hover{background:#101014}
input::placeholder{color:#4a4a52}
select option{background:#141418;color:#EDEDF0}
button{transition:opacity .15s}
button:active{opacity:.75}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0A0A0C}
::-webkit-scrollbar-thumb{background:#26262c}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bar{animation:grow .7s cubic-bezier(.22,.8,.36,1) both}
.blurred{filter:blur(8px);pointer-events:none;user-select:none}
.goldline{animation:goldline .8s ease both}
@media(max-width:768px){
.grid5{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr}
.grid2{grid-template-columns:1fr}
}
</style>

});

function useIsMobile(){const[m,setM]=useState(false);useEffect(()=>{const c=()=>setM(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c)},[]);return m}
function useCountUp(t,dur=900){const[v,setV]=useState(0);useEffect(()=>{let raf,s;const tick=x=>{if(!s)s=x;const p=Math.min((x-s)/dur,1);setV(t*(1-Math.pow(1-p,3)));if(p<1)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf)},[t,dur]);return v}

function Logo({onSecret}){
const taps=useRef([]);
const tap=()=>{const now=Date.now();taps.current=taps.current.filter(t=>now-t<2500);taps.current.push(now);
if(taps.current.length>=5){taps.current=[];onSecret()}};
return(<span onClick={tap} style={{fontSize:13,fontWeight:600,letterSpacing:3,color:C.white,whiteSpace:"nowrap",cursor:"default",userSelect:"none"}}>INSPECTOR<span style={{color:C.steel}}>·</span></span>)}

<span style={{fontSize:12,color:C.text,fontWeight:500,letterSpacing:2}}>{t?t.toLocaleTimeString("en-IN",{hour12:false}):"--:--:--"}</span>
{onLogout&&<button onClick={onLogout} style={{background:"none",border:`1px solid ${C.border2}`,color:C.label,fontFamily:"inherit",fontSize:8,letterSpacing:1.5,padding:"4px 8px",cursor:"pointer",marginLeft:4}}>EXIT</button>}</div>)}

function Ticker(){
const items=[["SPCB","STACK TEMP ≤180°C"],["RATIO","COAL/PADDY ≤25%"],["CONSENT","RENEW ANNUALLY"],["EMISSION","PM ≤150mg/Nm³"],["RECORDS","KEEP 5 YEARS"],["AUDIT","SURPRISE CHECKS"]];

{all.map((x,i)=><span key={i} style={{fontSize:9,letterSpacing:1.5,color:C.dim}}>{x[0]} <span style={{color:C.steelSoft}}>{x[1]}</span></span>)}</div></div>)}

const Panel=({title,action,children,style})=>(<div className="panel-in" style={{background:C.panel,border:`1px solid ${C.border}`,...style}}>
{title&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"10px 14px",borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
<span style={{fontSize:9,fontWeight:500,letterSpacing:2.5,color:C.label}}>{title}</span>{action}</div>}
<div style={{padding:14}}>{children}</div></div>);

const Metric=({label,value,suffix="",delta,deltaColor,animate=true})=>{

<div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:8}}>{label}</div>
<div style={{fontSize:21,fontWeight:500,color:C.white,lineHeight:1,letterSpacing:.5}}>{disp}</div>
{delta&&<div style={{fontSize:9,color:deltaColor||C.label,marginTop:6,letterSpacing:.5}}>{delta}</div>}
<div className="goldline" style={{position:"absolute",bottom:0,left:0,height:1,background:`linear-gradient(90deg,${C.steel} 0%,transparent 80%)`,opacity:.6}}/></div>)};

{thr&&<div style={{position:"absolute",left:0,right:0,bottom:`${(thr/max)*170/190*100}%`,borderTop:`1px dashed ${C.bad}`,zIndex:1}}><span style={{position:"absolute",right:0,top:-12,fontSize:8,color:C.bad,letterSpacing:1}}>LIMIT {thr}°</span></div>}
{data.map((d,i)=>(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5,height:"100%",justifyContent:"flex-end"}}>
<div className="bar" style={{width:"62%",height:`${(d.v/max)*100}%`,minHeight:d.v>0?2:0,background:d.flag?`linear-gradient(180deg,${C.bad},#6e2936)`:`linear-gradient(180deg,${C.steel},${C.steelSoft})`,animationDelay:`${i*45}ms`}}/>

{i===0&&<div style={{position:"absolute",top:-8,right:14,background:C.steel,color:"#0A0A0C",fontSize:7,fontWeight:600,letterSpacing:1.5,padding:"3px 9px"}}>PREFERRED</div>}

<div style={{fontSize:8,color:C.dim,letterSpacing:1.5,marginBottom:18,lineHeight:1.8}}>SELECT A PLAN · PAY VIA WHATSAPP · ACCESS CODE ISSUED IMMEDIATELY</div>

function Dashboard({entries,onLog}){
const stats=useMemo(()=>{
const paddy=entries.reduce((s,e)=>s+Number(e.paddy),0);
const temps=entries.map(e=>Number(e.temp)).filter(x=>x>0);
const avgTemp=temps.length?temps.reduce((a,b)=>a+b,0)/temps.length:0;
const alerts=entries.filter(isFlagged).length;
const compliance=entries.length?Math.round((entries.length-alerts)/entries.length*100):0;
return{records:entries.length,paddy,avgTemp,alerts,compliance}},[entries]);
const trend=useMemo(()=>entries.slice().reverse().slice(-12).map(e=>({label:e.date.slice(5),v:Number(e.temp),flag:isFlagged(e)})),[entries]);
const ratio=useMemo(()=>{const p=entries.reduce((s,e)=>s+Number(e.paddy),0);const c=entries.reduce((s,e)=>s+Number(e.coal),0);return p>0?(c/p*100):0},[entries]);
if(entries.length===0)return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
<div className="grid5">{["RECORDS","OUTPUT KG","AVG TEMP","ALERT DAYS","COMPLIANCE"].map(l=><Metric key={l} label={l} value={0}/>)}</div>
<Panel title="BOILER TEMP · TREND"><Empty msg="The chart appears after your first daily entry." cta="LOG TODAY'S DATA" onCta={onLog}/></Panel></div>);
return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
<div className="grid5">
<Metric label="RECORDS" value={stats.records}/>
<Metric label="OUTPUT KG" value={stats.paddy}/>
<Metric label="AVG BOILER TEMP" value={Math.round(stats.avgTemp)} suffix="°C" deltaColor={stats.avgTemp>TEMP_THRESHOLD?C.bad:C.ok} delta={stats.avgTemp>TEMP_THRESHOLD?"above limit":"within limit"}/>
<Metric label="ALERT DAYS" value={stats.alerts} deltaColor={stats.alerts>0?C.bad:C.ok} delta={stats.alerts>0?"needs action":"all clear"}/>
<Metric label="COMPLIANCE" value={stats.compliance} suffix="%" deltaColor={stats.compliance>=80?C.ok:C.warn}/></div>
<Panel title="BOILER STACK TEMP · TREND (°C)"><BarChartLite data={trend} thr={TEMP_THRESHOLD}/></Panel>
<Panel title="BOILER EFFICIENCY">
<div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
<span style={{width:8,height:8,borderRadius:"50%",background:ratio>RATIO_THRESHOLD?C.bad:C.ok}}/>
<span style={{fontSize:12,fontWeight:500,letterSpacing:1,color:ratio>RATIO_THRESHOLD?C.bad:C.ok}}>{ratio>RATIO_THRESHOLD?"OVER THRESHOLD · REVIEW REQUIRED":"EFFICIENT · COMPLIANT"}</span></div>
<div style={{fontSize:11,color:C.text}}>Fuel/Output Ratio: <span style={{color:C.steel,fontWeight:500}}>{ratio.toFixed(1)}%</span> <span style={{color:C.dim}}>(threshold {RATIO_THRESHOLD}%)</span></div></Panel></div>)}

function DailyLog({entries,onLog}){
return(<Panel title="PRODUCTION & BOILER LOG" action={<button onClick={onLog} style={btnPrimary}>+ NEW ENTRY</button>}>
{entries.length===0?<Empty msg="No entries on record. Begin with today's production data." cta="LOG ENTRY" onCta={onLog}/>:
<Scroll><table style={tbl}><thead><tr style={trHead}><th style={th}>DATE</th><th style={thR}>OUTPUT KG</th><th style={thR}>FUEL KG</th><th style={thR}>RATIO</th><th style={thR}>TEMP °C</th><th style={thC}>STATUS</th></tr></thead><tbody>
{entries.map(e=>{const r=ratioOf(e);const fl=isFlagged(e);return(<tr key={e.id} className="row-hover" style={{borderBottom:`1px solid ${C.border}`}}>
<td style={{...td,color:C.steel,whiteSpace:"nowrap"}}>{e.date}</td>
<td style={tdR}>{Number(e.paddy).toLocaleString("en-IN")}</td>
<td style={tdR}>{Number(e.coal).toLocaleString("en-IN")}</td>
<td style={{...tdR,color:r>RATIO_THRESHOLD?C.bad:C.ok}}>{r.toFixed(1)}%</td>
<td style={{...tdR,color:Number(e.temp)>TEMP_THRESHOLD?C.bad:C.text}}>{e.temp}</td>
<td style={tdC}><span style={{fontSize:8,fontWeight:500,letterSpacing:1.5,color:fl?C.bad:C.ok,border:`1px solid ${fl?C.bad:C.ok}55`,padding:"3px 8px"}}>{fl?"ALERT":"OK"}</span></td></tr>)})}</tbody></table></Scroll>}</Panel>)}

function Compliance({entries}){

<Metric label="RECORDS ON FILE" value={entries.length} delta="SPCB ready"/></div>
<Panel title="SPCB COMPLIANCE SUMMARY">
{entries.length===0?<Empty msg="The compliance report builds from your daily logs."/>:
<div style={{fontSize:11,color:C.text}}>
{[["Stack Temp Limit",TEMP_THRESHOLD+"°C"],["Fuel/Output Limit",RATIO_THRESHOLD+"%"],["Days Logged",entries.length],["Non-Compliant Days",alerts.length]].map((x,i)=>(
<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:i<3?`1px solid ${C.border}`:"none"}}><span style={{color:C.label}}>{x[0]}</span><span style={{color:i===3&&alerts.length>0?C.bad:C.steel}}>{x[1]}</span></div>))}
{alerts.length>0&&<div style={{marginTop:14,padding:12,border:`1px solid ${C.bad}55`,fontSize:10,color:C.bad,letterSpacing:.5,lineHeight:1.7}}>{alerts.length} day(s) breached limits. Review boiler operation before the next SPCB audit.</div>}</div>}</Panel></div>)}

<Panel title="MEMBERSHIP">

<div style={{fontSize:11,color:C.text,lineHeight:1.9}}>Full vault · unlimited records · SPCB exports</div></div>):(<div>
<div style={{fontSize:11,color:C.text,lineHeight:2}}>
{[["SINGLE UNIT","₹4,999/yr"],["MULTI-UNIT","₹49,999/yr"],["ENTERPRISE","₹2,00,000/yr"]].map((p,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:i<2?`1px solid ${C.border}`:"none"}}><span style={{color:C.label}}>{p[0]}</span><span style={{color:C.steel}}>{p[1]}</span></div>))}</div>
<a href={`https://wa.me/${WHATSAPP}?text=Hi, I want Inspector for my factory. Please share details.`} target="_blank" style={{...btnPrimary,display:"block",textAlign:"center",textDecoration:"none",marginTop:16}}>TALK TO SALES →</a></div>)}</Panel></div>)}

function EntryModal({onClose,onSave,isMobile}){
const[date,setDate]=useState(new Date().toISOString().split("T")[0]);
const[paddy,setPaddy]=useState("");
const[coal,setCoal]=useState("");
const[temp,setTemp]=useState("");
const ratio=paddy>0?(coal/paddy*100):0;
const flag=ratio>RATIO_THRESHOLD||Number(temp)>TEMP_THRESHOLD;
const save=()=>{if(!paddy||!coal||!temp){alert("Fill paddy, coal and boiler temp.");return}onSave({id:Date.now(),date,paddy:Number(paddy),coal:Number(coal),temp:Number(temp)});onClose()};
return(<div style={{position:"fixed",inset:0,background:"rgba(7,7,9,.88)",display:"flex",alignItems:isMobile?"flex-start":"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:isMobile?0:16,overflow:"auto"}}>
<div className="modal-in" style={{background:C.bg,border:`1px solid ${C.steelSoft}`,width:500,maxWidth:"100%",minHeight:isMobile?"100vh":"auto"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",borderBottom:`1px solid ${C.border2}`,position:"sticky",top:0,background:C.bg}}>
<span style={{fontWeight:600,letterSpacing:3,fontSize:11,color:C.steel}}>NEW DAILY ENTRY</span>
<button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:C.label}}>✕</button></div>
<div style={{padding:18}}>
<div style={{marginBottom:12}}><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>DATE</div><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={input}/></div>
<div className="grid2" style={{marginBottom:12}}>
<div><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>PRODUCTION OUTPUT (KG)</div><input type="number" placeholder="0" value={paddy} onChange={e=>setPaddy(e.target.value)} style={input}/></div>
<div><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>FUEL USED (KG)</div><input type="number" placeholder="0" value={coal} onChange={e=>setCoal(e.target.value)} style={input}/></div></div>
<div style={{marginBottom:14}}><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>BOILER STACK TEMP (°C)</div><input type="number" placeholder="0" value={temp} onChange={e=>setTemp(e.target.value)} style={input}/></div>
<div style={{padding:14,background:C.panel,border:`1px solid ${flag?C.bad+"55":C.border}`}}>
<div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.label,padding:"4px 0",letterSpacing:1}}><span>FUEL/OUTPUT RATIO</span><span style={{color:ratio>RATIO_THRESHOLD?C.bad:C.ok,fontWeight:500}}>{ratio.toFixed(1)}%</span></div>
<div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.label,padding:"4px 0",letterSpacing:1}}><span>STATUS</span><span style={{color:flag?C.bad:C.ok,fontWeight:500}}>{flag?"ALERT — REVIEW":"COMPLIANT"}</span></div></div>
<button onClick={save} style={{...btnPrimary,width:"100%",marginTop:16}}>SAVE ENTRY</button></div></div></div>)}

const btnPrimary={background:C.steel,color:"#0A0A0C",border:"none",fontFamily:"inherit",fontWeight:600,fontSize:10,letterSpacing:2,padding:"10px 16px",cursor:"pointer"};
const chip={background:"none",border:`1px solid ${C.border2}`,color:C.label,fontFamily:"inherit",fontSize:9,letterSpacing:1.5,padding:"6px 12px",cursor:"pointer"};
const input={background:C.bg3,border:`1px solid ${C.border2}`,color:C.white,fontFamily:"inherit",fontSize:13,padding:"10px 11px",outline:"none",width:"100%"};
const tbl={width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:440};
const trHead={color:C.dim,fontSize:8,letterSpacing:1.5,textAlign:"left",borderBottom:`1px solid ${C.border2}`};
const th={padding:"9px 6px",fontWeight:500};
const thR={...th,textAlign:"right"};
const thC={...th,textAlign:"center"};
const td={padding:"11px 6px",color:C.text};
const tdR={...td,textAlign:"right"};
const tdC={...td,textAlign:"center"};

function AuthGate({onAuthed}){
const[mode,setMode]=useState("login");
const[email,setEmail]=useState("");
const[pw,setPw]=useState("");
const[busy,setBusy]=useState(false);
const[err,setErr]=useState("");
const submit=async()=>{
if(!email||!pw){setErr("Enter email and password");return}
if(pw.length<6){setErr("Password must be at least 6 characters");return}
setBusy(true);setErr("");
try{
let res;
if(mode==="signup"){res=await sb.auth.signUp({email,password:pw});}
else{res=await sb.auth.signInWithPassword({email,password:pw});}
if(res.error){setErr(res.error.message);setBusy(false);return}

if(!res.data.session){
const si=await sb.auth.signInWithPassword({email,password:pw});
if(si.error){setErr("Account created. Please log in.");setMode("login");setBusy(false);return}
}
onAuthed();
}catch(e){setErr(e.message||"Something went wrong");setBusy(false)}
};
return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
<div style={{fontSize:24,fontWeight:600,letterSpacing:6,color:C.white,marginBottom:6}}>INSPECTOR<span style={{color:C.steel}}>·</span></div>
<div style={{fontSize:9,color:C.label,letterSpacing:3,marginBottom:36}}>INDUSTRIAL COMPLIANCE VAULT</div>
<div style={{width:360,maxWidth:"100%",border:`1px solid ${C.steelSoft}`,background:"#000",padding:"30px 26px"}}>
<div style={{display:"flex",gap:0,marginBottom:24,borderBottom:`1px solid ${C.border2}`}}>
<button onClick={()=>{setMode("login");setErr("")}} style={{flex:1,background:"none",border:"none",borderBottom:mode==="login"?`2px solid ${C.steel}`:"2px solid transparent",color:mode==="login"?C.steel:C.label,fontFamily:"inherit",fontSize:11,letterSpacing:2,padding:"10px 0",cursor:"pointer"}}>LOG IN</button>
<button onClick={()=>{setMode("signup");setErr("")}} style={{flex:1,background:"none",border:"none",borderBottom:mode==="signup"?`2px solid ${C.steel}`:"2px solid transparent",color:mode==="signup"?C.steel:C.label,fontFamily:"inherit",fontSize:11,letterSpacing:2,padding:"10px 0",cursor:"pointer"}}>SIGN UP</button></div>
<div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>EMAIL</div>
<input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@mill.com" style={{...input,marginBottom:14}}/>
<div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>PASSWORD</div>
<input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="\u2022\u2022\u2022\u2022\u2022\u2022" style={{...input,marginBottom:18}}/>
<button onClick={submit} disabled={busy} style={{...btnPrimary,width:"100%",opacity:busy?.6:1}}>{busy?"PLEASE WAIT...":(mode==="signup"?"CREATE ACCOUNT \u2192":"ENTER \u2192")}</button>
{err&&<div style={{fontSize:9,color:C.bad,marginTop:12,letterSpacing:.5,lineHeight:1.5}}>{err}</div>}
{mode==="signup"&&<div style={{fontSize:8,color:C.dim,marginTop:14,letterSpacing:1,lineHeight:1.6}}>7-DAY FREE TRIAL STARTS ON SIGNUP. NO CARD NEEDED.</div>}
</div></div>)}

function INSPECTOR(){
const[active,setActive]=useState("dashboard");
const[showE,setShowE]=useState(false);
const[showSecret,setShowSecret]=useState(false);
const[mill,setMill]=useState("");
const[pro,setPro]=useState(false);
const[godPro,setGodPro]=useState(()=>localStorage.getItem("insp_god")==="1");
const[entries,setEntries]=useState([]);
const[trialStart,setTrialStart]=useState(null);
const[loading,setLoading]=useState(true);
const isMobile=useIsMobile();
const userId=useRef(null);
// Load profile + entries from Supabase on mount
useEffect(()=>{(async()=>{
const{data:{user}}=await sb.auth.getUser();
if(!user){setLoading(false);return}
userId.current=user.id;
const{data:prof}=await sb.from("profiles").select("*").eq("id",user.id).single();
if(prof){setPro(prof.is_pro);setTrialStart(new Date(prof.trial_start).getTime());if(prof.mill_name)setMill(prof.mill_name)}
const{data:ents}=await sb.from("entries").select("*").eq("user_id",user.id).order("entry_date",{ascending:false});
if(ents)setEntries(ents.map(e=>({id:e.id,date:e.entry_date,paddy:Number(e.paddy),coal:Number(e.coal),temp:Number(e.temp)})));
setLoading(false);
})()},[]);
const daysUsed=trialStart?Math.floor((Date.now()-trialStart)/(24*60*60*1000)):0;
const walled=!pro&&!godPro&&trialStart&&daysUsed>=TRIAL_DAYS;
const add=async e=>{
setEntries(p=>[e,...p].sort((a,b)=>b.date.localeCompare(a.date)));
if(userId.current){await sb.from("entries").insert({user_id:userId.current,entry_date:e.date,paddy:e.paddy,coal:e.coal,temp:e.temp})}
};
const unlockPro=async()=>{setPro(true);if(userId.current){await sb.from("profiles").update({is_pro:true}).eq("id",userId.current)}};
const unlockGod=()=>{setGodPro(true);localStorage.setItem("insp_god","1")};
if(loading)return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.label,fontSize:10,letterSpacing:3}}>LOADING VAULT...</div>);
const render=()=>{switch(active){
case"dashboard":return<Dashboard entries={entries} onLog={()=>setShowE(true)}/>;
case"log":return<DailyLog entries={entries} onLog={()=>setShowE(true)}/>;
case"compliance":return<Compliance entries={entries}/>;
case"config":return<Config mill={mill} setMill={async(v)=>{setMill(v);if(userId.current)await sb.from("profiles").update({mill_name:v}).eq("id",userId.current)}} pro={pro||godPro}/>;
default:return<Dashboard entries={entries} onLog={()=>setShowE(true)}/>}};
const NavBtn=({m})=>(<button onClick={()=>setActive(m.id)} style={{display:"flex",alignItems:"center",padding:isMobile?"9px 15px":"11px 18px",width:isMobile?"auto":"100%",background:"transparent",border:"none",borderLeft:isMobile?"none":(active===m.id?`1px solid ${C.steel}`:"1px solid transparent"),borderBottom:isMobile?(active===m.id?`1px solid ${C.steel}`:"1px solid transparent"):"none",color:active===m.id?C.steel:C.label,fontFamily:"inherit",fontSize:10,letterSpacing:2,cursor:"pointer",textAlign:"left",whiteSpace:"nowrap"}}>{m.label}</button>);
return(<div style={{background:C.bg,color:C.text,minHeight:"100vh",fontSize:12}}>
<StatusBar pro={pro||godPro} onSecret={()=>setShowSecret(true)} onLogout={async()=>{await sb.auth.signOut();location.reload()}}/>
<Ticker/>
{isMobile&&<div style={{display:"flex",overflowX:"auto",background:"#070709",borderBottom:`1px solid ${C.border}`,WebkitOverflowScrolling:"touch"}}>{MODULES.map(m=><NavBtn key={m.id} m={m}/>)}</div>}
<div style={{display:"flex",minHeight:"calc(100vh - 72px)"}}>
{!isMobile&&<div style={{width:176,background:"#070709",borderRight:`1px solid ${C.border}`,padding:"14px 0",flexShrink:0}}>
{MODULES.map(m=><NavBtn key={m.id} m={m}/>)}
<div style={{padding:"18px",marginTop:24,borderTop:`1px solid ${C.border}`}}>
<div style={{fontSize:8,color:C.dim,letterSpacing:2,marginBottom:8}}>MEMBERSHIP</div>
<div style={{fontSize:11,color:C.steel,letterSpacing:1.5}}>{(pro||godPro)?"PRO":"EVALUATION"}</div>
<div style={{fontSize:8,color:C.label,marginTop:5,letterSpacing:.5}}>{(pro||godPro)?"Unlimited access":`${Math.max(0,TRIAL_DAYS-daysUsed)} days remaining`}</div></div></div>}
<div style={{flex:1,padding:14,overflow:"hidden",minWidth:0}} className={walled?"blurred":""}>
<div style={{marginBottom:16}}>
<h1 style={{fontSize:16,fontWeight:600,letterSpacing:2,color:C.white}}>{active==="dashboard"?"Inspector Shield":MODULES.find(m=>m.id===active).label}</h1>
<div style={{fontSize:9,color:C.label,marginTop:5,letterSpacing:1}}>INDUSTRIAL COMPLIANCE VAULT · SPCB MONITORING</div></div>
{render()}</div></div>
{walled&&<Paywall onUnlock={unlockPro}/>}
{showSecret&&<SecretEntry onClose={()=>setShowSecret(false)} onUnlock={unlockGod}/>}
{showE&&!walled&&<EntryModal onClose={()=>setShowE(false)} onSave={add} isMobile={isMobile}/>}</div>)}

function App(){
if(!sb)return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.bad,fontFamily:"monospace",fontSize:11,letterSpacing:2,textAlign:"center",padding:20}}>CONNECTION ERROR<br/><span style={{color:C.label,fontSize:9}}>Please refresh the page</span></div>);
const[session,setSession]=useState(undefined); // undefined=loading, null=logged out, obj=logged in
useEffect(()=>{
sb.auth.getSession().then(({data})=>setSession(data.session));
const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
return()=>sub.subscription.unsubscribe();
},[]);
if(session===undefined)return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.label,fontSize:10,letterSpacing:3}}>INITIALIZING...</div>);
if(!session)return<AuthGate onAuthed={()=>{}}/>;
return<INSPECTOR key={session.user.id}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
