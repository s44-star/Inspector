<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>INSPECTOR · powered by LexConv</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#02060a;font-family:'IBM Plex Mono',monospace}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{height:0}to{}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.panel-in{animation:fadeUp .35s ease both}
.modal-in{animation:modalIn .2s ease both}
.row-hover{transition:background .15s}
.row-hover:hover{background:#061320}
input::placeholder{color:#3a5a6b}
select option{background:#0a1a24;color:#fff}
button:active{filter:brightness(1.2)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#02060a}
::-webkit-scrollbar-thumb{background:#1d3a4d}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bar{animation:grow .6s ease both}
@media(max-width:768px){
.grid5{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:1fr}
.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#02060a;font-family:'IBM Plex Mono',monospace">
    <div style="font-size:26px;font-weight:800;letter-spacing:4px;color:#fff;text-shadow:0 0 12px #00D4FF,0 0 24px rgba(0,212,255,.4)">INSPECTOR<span style="color:#00D4FF">·</span></div>
    <div style="font-size:10px;color:#5a8499;letter-spacing:2px;margin-top:8px">POWERED BY <span style="color:#00D4FF">LEXCONV</span></div>
    <div style="font-size:9px;color:#3a5a6b;letter-spacing:2px;margin-top:20px;animation:pulse 1.2s ease-in-out infinite">INITIALIZING COMPLIANCE VAULT...</div>
  </div>
</div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const C={bg:"#02060a",bg2:"#061320",bg3:"#0a1a24",panel:"#07131c",border:"#11293a",border2:"#1d3a4d",cyan:"#00D4FF",cyanDim:"#0099b8",green:"#00FF9D",red:"#FF4D6D",yellow:"#FFD600",text:"#bfdfe8",dim:"#3a5a6b",label:"#5a8499"};
const glow=(c=C.cyan,s=12)=>`0 0 ${s}px ${c}, 0 0 ${s*2}px rgba(0,212,255,0.15)`;
const RATIO_THRESHOLD=25;   // coal/paddy % above this = inefficient/non-compliant
const TEMP_THRESHOLD=180;   // boiler stack temp °C above this = SPCB alert
const MODULES=[{id:"dashboard",label:"DASHBOARD",icon:"▣"},{id:"log",label:"DAILY LOG",icon:"▤"},{id:"compliance",label:"COMPLIANCE",icon:"▧"},{id:"config",label:"CONFIG",icon:"⚙"}];

function useIsMobile(){const[m,setM]=useState(false);useEffect(()=>{const c=()=>setM(window.innerWidth<768);c();window.addEventListener("resize",c);return()=>window.removeEventListener("resize",c)},[]);return m}
function useCountUp(t,dur=900){const[v,setV]=useState(0);useEffect(()=>{let raf,s;const tick=x=>{if(!s)s=x;const p=Math.min((x-s)/dur,1);setV(t*(1-Math.pow(1-p,3)));if(p<1)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf)},[t,dur]);return v}

// compliance logic
const ratioOf=e=>e.paddy>0?(e.coal/e.paddy*100):0;
const isFlagged=e=>ratioOf(e)>RATIO_THRESHOLD||Number(e.temp)>TEMP_THRESHOLD;

function StatusBar({mill}){
const[t,setT]=useState(null);
useEffect(()=>{setT(new Date());const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
return(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#000",borderBottom:`1px solid ${C.cyan}`,boxShadow:glow(C.cyan,6),padding:"7px 12px",position:"sticky",top:0,zIndex:100}}>
<div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
<span style={{fontSize:14,fontWeight:800,letterSpacing:2,color:"#fff",textShadow:glow(C.cyan,8),whiteSpace:"nowrap"}}>INSPECTOR<span style={{color:C.cyan}}>·</span></span>
<span style={{fontSize:8,color:C.label,whiteSpace:"nowrap"}}>by <span style={{color:C.cyan}}>LexConv</span></span></div>
<div style={{display:"flex",alignItems:"center",gap:8}}>
<span style={{fontSize:10,color:C.label,whiteSpace:"nowrap"}}>{mill||"YOUR MILL"}</span>
<span style={{color:C.dim}}>|</span>
<span style={{fontSize:12,color:C.cyan,fontWeight:600,letterSpacing:1,textShadow:glow(C.cyan,5)}}>{t?t.toLocaleTimeString("en-IN",{hour12:false}):"--:--:--"}</span></div></div>)}

function Ticker(){
const items=[["SPCB","STACK TEMP ≤180°C"],["RATIO","COAL/PADDY ≤25%"],["CONSENT","RENEW ANNUALLY"],["EMISSION","PM ≤150mg/Nm³"],["RECORDS","KEEP 5 YEARS"],["AUDIT","SURPRISE CHECKS"]];
const all=[...items,...items];
return(<div style={{background:"#000",borderBottom:`1px solid ${C.border}`,overflow:"hidden",whiteSpace:"nowrap",padding:"5px 0"}}>
<div style={{display:"inline-flex",gap:30,animation:"tk 28s linear infinite"}}>
{all.map((x,i)=><span key={i} style={{fontSize:10,letterSpacing:1,color:C.label}}>{x[0]} <span style={{color:C.cyan}}>{x[1]}</span></span>)}</div></div>)}

const Panel=({title,action,children,style})=>(<div className="panel-in" style={{background:C.panel,border:`1px solid ${C.border}`,...style}}>
{title&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"8px 12px",background:C.bg3,borderBottom:`1px solid ${C.border2}`,flexWrap:"wrap"}}>
<span style={{fontSize:9,fontWeight:700,letterSpacing:1.5,color:C.cyan,textShadow:glow(C.cyan,4)}}>{title}</span>{action}</div>}
<div style={{padding:12}}>{children}</div></div>);

const Metric=({label,value,suffix="",delta,deltaColor,animate=true})=>{
const num=typeof value==="number"?value:0;
const a=useCountUp(animate?num:0);
const disp=typeof value==="number"?Math.round(a).toLocaleString("en-IN")+suffix:value;
return(<div className="panel-in" style={{background:C.panel,border:`1px solid ${C.border}`,padding:"12px 14px",position:"relative",overflow:"hidden"}}>
<div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:6}}>{label}</div>
<div style={{fontSize:22,fontWeight:700,color:"#fff",lineHeight:1,textShadow:glow(C.cyan,6)}}>{disp}</div>
{delta&&<div style={{fontSize:10,color:deltaColor||C.cyan,marginTop:5}}>{delta}</div>}
<div style={{position:"absolute",bottom:0,left:0,height:2,width:"100%",background:`linear-gradient(90deg,${C.cyan},transparent)`,opacity:.5}}/></div>)};

const Empty=({msg,cta,onCta})=>(<div style={{padding:"40px 16px",textAlign:"center"}}>
<div style={{fontSize:30,color:C.border2,marginBottom:12}}>◈</div>
<div style={{fontSize:12,color:C.label,marginBottom:cta?16:0,lineHeight:1.5}}>{msg}</div>
{cta&&<button onClick={onCta} style={btnPrimary}>{cta}</button>}</div>);

const Scroll=({children})=><div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>{children}</div>;

function BarChartLite({data,thr}){
const max=Math.max(...data.map(d=>d.v),thr||1);
return(<div style={{display:"flex",alignItems:"flex-end",gap:4,height:200,padding:"10px 0",position:"relative",borderBottom:`1px solid ${C.border2}`}}>
{thr&&<div style={{position:"absolute",left:0,right:0,bottom:`${10+(thr/max)*180/200*100}%`,borderTop:`1px dashed ${C.red}`,zIndex:1}}><span style={{position:"absolute",right:0,top:-12,fontSize:8,color:C.red}}>LIMIT {thr}°</span></div>}
{data.map((d,i)=>(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,height:"100%",justifyContent:"flex-end"}}>
<div className="bar" style={{width:"70%",height:`${(d.v/max)*100}%`,minHeight:d.v>0?3:0,background:d.flag?`linear-gradient(180deg,${C.red},#992233)`:`linear-gradient(180deg,${C.cyan},${C.cyanDim})`,boxShadow:d.v>0?glow(d.flag?C.red:C.cyan,4):"none",borderRadius:"2px 2px 0 0",animationDelay:`${i*40}ms`}}/>
<span style={{fontSize:8,color:C.label,whiteSpace:"nowrap"}}>{d.label}</span></div>))}</div>)}

function Dashboard({entries,onLog}){
const stats=useMemo(()=>{
const paddy=entries.reduce((s,e)=>s+Number(e.paddy),0);
const temps=entries.map(e=>Number(e.temp)).filter(x=>x>0);
const avgTemp=temps.length?temps.reduce((a,b)=>a+b,0)/temps.length:0;
const alerts=entries.filter(isFlagged).length;
const compliance=entries.length?Math.round((entries.length-alerts)/entries.length*100):0;
return{records:entries.length,paddy,avgTemp,alerts,compliance}},[entries]);
const trend=useMemo(()=>entries.slice().reverse().slice(-12).map(e=>({label:e.date.slice(5),v:Number(e.temp),flag:isFlagged(e)})),[entries]);
const ratio=useMemo(()=>{const p=entries.reduce((s,e)=>s+Number(e.paddy),0);const c=entries.reduce((s,e)=>s+Number(e.coal),0);return p>0?(c/p*100):0},[entries]);

if(entries.length===0)return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
<div className="grid5">{["RECORDS","PADDY KG","AVG TEMP","ALERT DAYS","COMPLIANCE"].map(l=><Metric key={l} label={l} value={0}/>)}</div>
<Panel title="▸ BOILER TEMP · TREND"><Empty msg="Chart appears after your first daily entry." cta="+ LOG TODAY'S DATA" onCta={onLog}/></Panel></div>);

return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
<div className="grid5">
<Metric label="RECORDS" value={stats.records}/>
<Metric label="PADDY KG" value={stats.paddy}/>
<Metric label="AVG BOILER TEMP" value={Math.round(stats.avgTemp)} suffix="°C" deltaColor={stats.avgTemp>TEMP_THRESHOLD?C.red:C.green} delta={stats.avgTemp>TEMP_THRESHOLD?"above limit":"within limit"}/>
<Metric label="ALERT DAYS" value={stats.alerts} deltaColor={stats.alerts>0?C.red:C.green} delta={stats.alerts>0?"needs action":"all clear"}/>
<Metric label="COMPLIANCE" value={stats.compliance} suffix="%" deltaColor={stats.compliance>=80?C.green:C.yellow}/></div>
<Panel title="▸ BOILER STACK TEMP · TREND (°C)"><BarChartLite data={trend} thr={TEMP_THRESHOLD}/></Panel>
<Panel title="▸ BOILER EFFICIENCY STATUS">
<div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
<span style={{width:10,height:10,borderRadius:"50%",background:ratio>RATIO_THRESHOLD?C.red:C.green,boxShadow:glow(ratio>RATIO_THRESHOLD?C.red:C.green,5)}}/>
<span style={{fontSize:14,fontWeight:700,color:ratio>RATIO_THRESHOLD?C.red:C.green}}>{ratio>RATIO_THRESHOLD?"INEFFICIENT · OVER THRESHOLD":"EFFICIENT · COMPLIANT"}</span></div>
<div style={{fontSize:12,color:C.text}}>Coal/Paddy Ratio: <span style={{color:C.cyan,fontWeight:700}}>{ratio.toFixed(1)}%</span> <span style={{color:C.dim}}>(Threshold: {RATIO_THRESHOLD}%)</span></div></Panel></div>)}

function DailyLog({entries,onLog,onDelete}){
return(<Panel title="▸ PROCUREMENT & BOILER LOG" action={<button onClick={onLog} style={btnPrimary}>+ NEW ENTRY</button>}>
{entries.length===0?<Empty msg="No entries yet. Start by logging today's mill data." cta="+ LOG ENTRY" onCta={onLog}/>:
<Scroll><table style={tbl}><thead><tr style={trHead}><th style={th}>DATE</th><th style={thR}>PADDY KG</th><th style={thR}>COAL KG</th><th style={thR}>RATIO</th><th style={thR}>TEMP °C</th><th style={thC}>STATUS</th></tr></thead><tbody>
{entries.map(e=>{const r=ratioOf(e);const fl=isFlagged(e);return(<tr key={e.id} className="row-hover" style={{borderBottom:`1px solid ${C.border}`}}>
<td style={{...td,color:C.cyan,whiteSpace:"nowrap"}}>{e.date}</td>
<td style={tdR}>{Number(e.paddy).toLocaleString("en-IN")}</td>
<td style={tdR}>{Number(e.coal).toLocaleString("en-IN")}</td>
<td style={{...tdR,color:r>RATIO_THRESHOLD?C.red:C.green}}>{r.toFixed(1)}%</td>
<td style={{...tdR,color:Number(e.temp)>TEMP_THRESHOLD?C.red:C.text}}>{e.temp}</td>
<td style={tdC}><span style={{fontSize:9,fontWeight:700,letterSpacing:1,color:fl?C.red:C.green,border:`1px solid ${fl?C.red:C.green}`,padding:"2px 6px"}}>{fl?"ALERT":"OK"}</span></td></tr>)})}</tbody></table></Scroll>}</Panel>)}

function Compliance({entries,mill}){
const alerts=entries.filter(isFlagged);
const compliance=entries.length?Math.round((entries.length-alerts.length)/entries.length*100):0;
return(<div style={{display:"flex",flexDirection:"column",gap:12}}>
<div className="grid3">
<Metric label="COMPLIANCE SCORE" value={compliance} suffix="%" deltaColor={compliance>=80?C.green:C.yellow}/>
<Metric label="TOTAL ALERTS" value={alerts.length} deltaColor={alerts.length>0?C.red:C.green}/>
<Metric label="RECORDS ON FILE" value={entries.length} delta="SPCB ready"/></div>
<Panel title="▸ SPCB COMPLIANCE SUMMARY" action={entries.length?<button style={btnSm}>↓ EXPORT REPORT</button>:null}>
{entries.length===0?<Empty msg="Compliance report builds from your daily logs."/>:
<div style={{fontSize:12,color:C.text,lineHeight:1.9}}>
<div style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}><span>Stack Temp Limit</span><span style={{color:C.cyan}}>{TEMP_THRESHOLD}°C</span></div>
<div style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}><span>Coal/Paddy Limit</span><span style={{color:C.cyan}}>{RATIO_THRESHOLD}%</span></div>
<div style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}><span>Days Logged</span><span style={{color:C.cyan}}>{entries.length}</span></div>
<div style={{display:"flex",justifyContent:"space-between",padding:"7px 0"}}><span>Non-Compliant Days</span><span style={{color:alerts.length?C.red:C.green}}>{alerts.length}</span></div>
{alerts.length>0&&<div style={{marginTop:12,padding:10,background:"rgba(255,77,109,0.08)",border:`1px solid ${C.red}`,fontSize:11,color:C.red}}>⚠ {alerts.length} day(s) breached limits. Review boiler operation before next SPCB audit.</div>}</div>}</Panel></div>)}

function Config({mill,setMill}){
return(<div className="grid2">
<Panel title="▸ MILL PROFILE">
<div style={{marginBottom:12}}><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>MILL NAME</div>
<input value={mill} onChange={e=>setMill(e.target.value)} placeholder="e.g. Maa Tarini Rice Mill" style={input}/></div>
<div style={{marginBottom:12}}><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>SPCB CONSENT NO</div><input placeholder="Consent to operate number" style={input}/></div>
<div style={{marginBottom:12}}><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>DISTRICT</div><input placeholder="e.g. Kalahandi" style={input}/></div>
<button style={btnPrimary}>SAVE PROFILE</button></Panel>
<Panel title="▸ COMPLIANCE THRESHOLDS">
<div style={{fontSize:12,color:C.text,lineHeight:2}}>
<div style={{display:"flex",justifyContent:"space-between"}}><span>Boiler Stack Temp Limit</span><span style={{color:C.cyan,fontWeight:700}}>{TEMP_THRESHOLD}°C</span></div>
<div style={{display:"flex",justifyContent:"space-between"}}><span>Coal/Paddy Ratio Limit</span><span style={{color:C.cyan,fontWeight:700}}>{RATIO_THRESHOLD}%</span></div></div>
<div style={{marginTop:14,fontSize:10,color:C.dim,lineHeight:1.6}}>These defaults follow common State Pollution Control Board norms for rice mills. Adjust to your consent conditions.</div>
<div style={{marginTop:16,padding:12,background:C.bg3,border:`1px solid ${C.border2}`}}>
<div style={{fontSize:11,color:C.cyan,fontWeight:700,marginBottom:6}}>SUBSCRIPTION</div>
<div style={{fontSize:20,fontWeight:700,color:C.cyan,textShadow:glow(C.cyan,8)}}>₹999<span style={{fontSize:11,color:C.label}}>/mo · PRO</span></div></div></Panel></div>)}

function EntryModal({onClose,onSave,isMobile}){
const[date,setDate]=useState(new Date().toISOString().split("T")[0]);
const[paddy,setPaddy]=useState("");
const[coal,setCoal]=useState("");
const[temp,setTemp]=useState("");
const ratio=paddy>0?(coal/paddy*100):0;
const flag=ratio>RATIO_THRESHOLD||Number(temp)>TEMP_THRESHOLD;
const save=()=>{if(!paddy||!coal||!temp){alert("Fill paddy, coal and boiler temp.");return}onSave({id:Date.now(),date,paddy:Number(paddy),coal:Number(coal),temp:Number(temp)});onClose()};
return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:isMobile?"flex-start":"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(5px)",padding:isMobile?0:16,overflow:"auto"}}>
<div className="modal-in" style={{background:C.bg,border:`1px solid ${C.cyan}`,boxShadow:glow(C.cyan,18),width:520,maxWidth:"100%",minHeight:isMobile?"100vh":"auto"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:C.cyan,color:"#000",position:"sticky",top:0}}>
<span style={{fontWeight:800,letterSpacing:1.5,fontSize:13}}>NEW DAILY ENTRY</span>
<button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#000"}}>✕</button></div>
<div style={{padding:16}}>
<div style={{marginBottom:12}}><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>DATE</div><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={input}/></div>
<div className="grid2" style={{marginBottom:12}}>
<div><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>PADDY PROCESSED (KG)</div><input type="number" placeholder="0" value={paddy} onChange={e=>setPaddy(e.target.value)} style={input}/></div>
<div><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>COAL / FUEL USED (KG)</div><input type="number" placeholder="0" value={coal} onChange={e=>setCoal(e.target.value)} style={input}/></div></div>
<div style={{marginBottom:14}}><div style={{fontSize:9,color:C.label,letterSpacing:1,marginBottom:4}}>BOILER STACK TEMP (°C)</div><input type="number" placeholder="0" value={temp} onChange={e=>setTemp(e.target.value)} style={input}/></div>
<div style={{padding:14,background:C.panel,border:`1px solid ${flag?C.red:C.border}`}}>
<div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.label,padding:"4px 0"}}><span>COAL/PADDY RATIO</span><span style={{color:ratio>RATIO_THRESHOLD?C.red:C.green,fontWeight:700}}>{ratio.toFixed(1)}%</span></div>
<div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.label,padding:"4px 0"}}><span>STATUS</span><span style={{color:flag?C.red:C.green,fontWeight:700}}>{flag?"⚠ ALERT — REVIEW":"✓ COMPLIANT"}</span></div></div>
<button onClick={save} style={{...btnPrimary,width:"100%",marginTop:16}}>SAVE ENTRY</button></div></div></div>)}

const btnPrimary={background:C.cyan,color:"#000",border:"none",fontFamily:"inherit",fontWeight:700,fontSize:11,letterSpacing:1,padding:"9px 14px",cursor:"pointer",boxShadow:glow(C.cyan,5)};
const btnSm={background:"none",border:`1px solid ${C.cyanDim}`,color:C.cyan,fontFamily:"inherit",fontSize:10,letterSpacing:1,padding:"4px 9px",cursor:"pointer"};
const input={background:C.bg3,border:`1px solid ${C.border2}`,color:"#fff",fontFamily:"inherit",fontSize:14,padding:"9px 10px",outline:"none",width:"100%"};
const tbl={width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:440};
const trHead={color:C.dim,fontSize:9,letterSpacing:1,textAlign:"left",borderBottom:`1px solid ${C.border2}`};
const th={padding:"8px 6px",fontWeight:600};
const thR={...th,textAlign:"right"};
const thC={...th,textAlign:"center"};
const td={padding:"10px 6px",color:C.text};
const tdR={...td,textAlign:"right"};
const tdC={...td,textAlign:"center"};

function INSPECTOR(){
const[active,setActive]=useState("dashboard");
const[showE,setShowE]=useState(false);
const[entries,setEntries]=useState([]);
const[mill,setMill]=useState("");
const isMobile=useIsMobile();
const add=e=>setEntries(p=>[e,...p].sort((a,b)=>b.date.localeCompare(a.date)));
const render=()=>{switch(active){
case"dashboard":return<Dashboard entries={entries} onLog={()=>setShowE(true)}/>;
case"log":return<DailyLog entries={entries} onLog={()=>setShowE(true)}/>;
case"compliance":return<Compliance entries={entries} mill={mill}/>;
case"config":return<Config mill={mill} setMill={setMill}/>;
default:return<Dashboard entries={entries} onLog={()=>setShowE(true)}/>}};
const NavBtn=({m})=>(<button onClick={()=>setActive(m.id)} style={{display:"flex",alignItems:"center",gap:8,padding:isMobile?"8px 14px":"11px 16px",width:isMobile?"auto":"100%",background:active===m.id?C.bg2:"transparent",border:"none",borderLeft:isMobile?"none":(active===m.id?`2px solid ${C.cyan}`:"2px solid transparent"),borderBottom:isMobile?(active===m.id?`2px solid ${C.cyan}`:"2px solid transparent"):"none",color:active===m.id?C.cyan:C.label,fontFamily:"inherit",fontSize:11,letterSpacing:1,cursor:"pointer",textAlign:"left",whiteSpace:"nowrap",textShadow:active===m.id?glow(C.cyan,4):"none"}}><span style={{fontSize:13}}>{m.icon}</span>{m.label}</button>);
return(<div style={{background:C.bg,color:C.text,minHeight:"100vh",fontSize:12}}>
<StatusBar mill={mill}/>
<Ticker/>
