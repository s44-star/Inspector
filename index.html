    setBusy(true);setErr("");
    try{
      let r=mode==="signup"?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});

      <div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:5}}>PASSWORD</div>

      {err&&<div style={{fontSize:12,color:"#FF6B6B",marginTop:12,fontWeight:500}}>{err}</div>}
      {mode==="signup"&&<div style={{fontSize:8,color:C.dim,marginTop:10,letterSpacing:1}}>7-DAY FREE TRIAL · NO CARD NEEDED</div>}

function Compliance({entries}){
  const alerts=entries.filter(e=>(e.paddy>0&&(e.coal/e.paddy*100)>RATIO_THR)||Number(e.temp)>TEMP_THR);
  const score=entries.length?Math.round((entries.length-alerts.length)/entries.length*100):100;
  const trend=entries.slice().reverse().slice(-12).map(e=>{const fl=(e.paddy>0&&(e.coal/e.paddy*100)>RATIO_THR)||Number(e.temp)>TEMP_THR;return{label:e.date.slice(5),v:Number(e.temp),alert:fl}});
  return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div className="g3">
      <Metric label="COMPLIANCE SCORE" value={score} suffix="%" dColor={score>=80?C.ok:C.bad}/>
      <Metric label="RECORDS ON FILE" value={entries.length} delta="SPCB ready"/>
      <Metric label="ALERT DAYS" value={alerts.length} dColor={alerts.length>0?C.bad:C.ok}/>
    </div>
    <Panel title="BOILER TEMP TREND (°C)">
      {trend.length>0?<SBar data={trend} flag={TEMP_THR}/>:<Empty msg="Logs populate the chart."/>}
    </Panel>
    <Panel title="COMPLIANCE SUMMARY">
      {[["Stack Temp Limit",TEMP_THR+"°C"],["Fuel/Output Limit",RATIO_THR+"%"],["Days Logged",entries.length],["Non-Compliant Days",alerts.length]].map((x,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"9px 0",borderBottom:i<3?`1px solid ${C.border}`:"none"}}>
          <span style={{color:C.label}}>{x[0]}</span>
          <span style={{color:i===3&&alerts.length>0?C.bad:C.steel}}>{x[1]}</span>
        </div>))}
      {alerts.length>0&&<div style={{marginTop:12,padding:10,border:`1px solid ${C.bad}44`,fontSize:10,color:C.bad,lineHeight:1.6}}>{alerts.length} day(s) over threshold — review before SPCB audit.</div>}
    </Panel>
  </div>)}

  const[coal,setCoal]=useState("");
  const[temp,setTemp]=useState("");
  const ratio=paddy>0?(coal/paddy*100):0;
  const flag=ratio>RATIO_THR||Number(temp)>TEMP_THR;
  const save=()=>{if(!paddy||!coal||!temp){alert("Fill all fields");return}
    onSave({entry_date:date,paddy:Number(paddy),coal:Number(coal),temp:Number(temp)});onClose()};
  return(<div style={{position:"fixed",inset:0,background:"rgba(7,7,9,.88)",display:"flex",alignItems:isMobile?"flex-start":"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:isMobile?0:16,overflow:"auto"}}>
    <div className="modal-in" style={{background:C.bg,border:`1px solid ${C.steelSoft}`,width:420,maxWidth:"100%",minHeight:isMobile?"100vh":"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 16px",borderBottom:`1px solid ${C.border2}`,position:"sticky",top:0,background:C.bg}}>
        <span style={{fontWeight:600,letterSpacing:3,fontSize:10,color:C.steel}}>SPCB DAILY LOG</span>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:C.label}}>✕</button>
      </div>
      <div style={{padding:16}}>
        <div style={{marginBottom:10}}><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:4}}>DATE</div><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={input}/></div>
        <div className="g2" style={{marginBottom:10}}>
          <div><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:4}}>PRODUCTION OUTPUT (KG)</div><input type="number" placeholder="0" value={paddy} onChange={e=>setPaddy(e.target.value)} style={input}/></div>
          <div><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:4}}>FUEL USED (KG)</div><input type="number" placeholder="0" value={coal} onChange={e=>setCoal(e.target.value)} style={input}/></div>
        </div>
        <div style={{marginBottom:10}}><div style={{fontSize:8,color:C.label,letterSpacing:2,marginBottom:4}}>BOILER STACK TEMP (°C)</div><input type="number" placeholder="0" value={temp} onChange={e=>setTemp(e.target.value)} style={input}/></div>
        <div style={{padding:12,background:C.panel,border:`1px solid ${flag?C.bad+"44":C.border}`,marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:4}}><span style={{color:C.label}}>FUEL/OUTPUT RATIO</span><span style={{color:ratio>RATIO_THR?C.bad:C.ok,fontWeight:500}}>{ratio.toFixed(1)}%</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10}}><span style={{color:C.label}}>STATUS</span><span style={{color:flag?C.bad:C.ok,fontWeight:500}}>{flag?"ALERT — REVIEW":"COMPLIANT"}</span></div>
        </div>
        <button onClick={save} style={{...btnPrimary,width:"100%"}}>SAVE LOG</button>
      </div>
    </div></div>)}

const btnPrimary={background:C.steel,color:"#0A0A0C",border:"none",fontFamily:"inherit",fontWeight:600,fontSize:10,letterSpacing:2,padding:"10px 16px",cursor:"pointer"};
const btnGhost={background:"none",border:`1px solid ${C.border2}`,color:C.text,fontFamily:"inherit",fontWeight:500,fontSize:10,letterSpacing:2,padding:"10px 16px",cursor:"pointer"};
const input={background:C.bg3,border:`1px solid ${C.border2}`,color:C.white,fontFamily:"inherit",fontSize:13,padding:"10px 11px",outline:"none",width:"100%"};
const tbl={width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:420};
const trHead={color:C.dim,fontSize:8,letterSpacing:1.5,textAlign:"left",borderBottom:`1px solid ${C.border2}`};
const th={padding:"9px 6px",fontWeight:500};
const thR={...th,textAlign:"right"};
const thC={...th,textAlign:"center"};
const td={padding:"11px 6px",color:C.text};
const tdR={...td,textAlign:"right"};
const tdC={...td,textAlign:"center"};

function INSPECTOR(){
  const[active,setActive]=useState("dashboard");
  const[pro,setPro]=useState(false);
  const[godPro,setGodPro]=useState(()=>localStorage.getItem("insp_god")==="1");
  const[entries,setEntries]=useState([]);
  const[procurement,setProcurement]=useState([]);
  const[production,setProduction]=useState([]);
  const[sales,setSales]=useState([]);
  const[mill,setMill]=useState("");
  const[trialStart,setTrialStart]=useState(null);
  const[loading,setLoading]=useState(true);
  const[showSecret,setShowSecret]=useState(false);
  const[showSPCB,setShowSPCB]=useState(false);
  const[showProcure,setShowProcure]=useState(false);
  const[showProduce,setShowProduce]=useState(false);
  const[showSell,setShowSell]=useState(false);
  const uid=useRef(null);
  const isMobile=useIsMobile();

  useEffect(()=>{(async()=>{
    try{
      const{data:{user}}=await sb.auth.getUser();
      if(!user){setLoading(false);return}
      const u=user.id||user.sub;uid.current=u;
      try{const{data:p}=await sb.from("profiles").select("*").eq("id",u).single();
        if(p){if(p.is_pro)setPro(true);if(p.trial_start)setTrialStart(new Date(p.trial_start).getTime());if(p.mill_name)setMill(p.mill_name)}
        else{setTrialStart(Date.now())}}catch(e){setTrialStart(Date.now())}
      try{const{data:d}=await sb.from("entries").select("*").eq("user_id",u).order("entry_date",{ascending:false});
        if(d&&Array.isArray(d))setEntries(d.map(e=>({id:e.id,date:e.entry_date,paddy:Number(e.paddy),coal:Number(e.coal),temp:Number(e.temp)})))}catch(e){}
      try{const{data:d}=await sb.from("procurement").select("*").eq("user_id",u).order("entry_date",{ascending:false});
        if(d&&Array.isArray(d))setProcurement(d)}catch(e){}
      try{const{data:d}=await sb.from("production").select("*").eq("user_id",u).order("entry_date",{ascending:false});
        if(d&&Array.isArray(d))setProduction(d)}catch(e){}
      try{const{data:d}=await sb.from("sales").select("*").eq("user_id",u).order("entry_date",{ascending:false});
        if(d&&Array.isArray(d))setSales(d)}catch(e){}
    }catch(e){}
    setLoading(false);
  })()},[]);

  const daysUsed=trialStart?Math.floor((Date.now()-trialStart)/(86400000)):0;
  const isProActive=pro||godPro;
  const walled=!isProActive&&trialStart&&daysUsed>=TRIAL_DAYS;

  const addSPCB=async e=>{const r={id:Date.now(),date:e.entry_date,paddy:e.paddy,coal:e.coal,temp:e.temp};
    setEntries(p=>[r,...p].sort((a,b)=>b.date.localeCompare(a.date)));
    try{if(uid.current)await sb.from("entries").insert({user_id:uid.current,entry_date:e.entry_date,paddy:e.paddy,coal:e.coal,temp:e.temp})}catch(e){}};
  const addProcure=async e=>{setProcurement(p=>[e,...p]);
    try{if(uid.current)await sb.from("procurement").insert({user_id:uid.current,...e})}catch(err){}};
  const addProduce=async e=>{setProduction(p=>[e,...p]);
    try{if(uid.current)await sb.from("production").insert({user_id:uid.current,...e})}catch(err){}};
  const addSale=async e=>{setSales(p=>[e,...p]);
    try{if(uid.current)await sb.from("sales").insert({user_id:uid.current,...e})}catch(err){}};
  const unlockPro=async()=>{setPro(true);try{if(uid.current)await sb.from("profiles").update({is_pro:true}).eq("id",uid.current)}catch(e){}};
  const unlockGod=()=>{setGodPro(true);localStorage.setItem("insp_god","1")};

  if(loading)return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.label,fontSize:10,letterSpacing:3}}>LOADING MILL OS...</div>);

  const NavBtn=({m})=>{
    const isSec=MODS.find(x=>x.id===m.id);
    return(<button onClick={()=>setActive(m.id)} style={{display:"flex",alignItems:"center",padding:isMobile?"9px 12px":"11px 18px",width:isMobile?"auto":"100%",background:"transparent",border:"none",borderLeft:isMobile?"none":(active===m.id?`1px solid ${C.steel}`:"1px solid transparent"),borderBottom:isMobile?(active===m.id?`2px solid ${C.steel}`:"2px solid transparent"):"none",color:active===m.id?C.steel:C.label,fontFamily:"inherit",fontSize:9,letterSpacing:2,cursor:"pointer",textAlign:"left",whiteSpace:"nowrap"}}>{m.label}</button>)};

  const render=()=>{
    switch(active){
      case"dashboard":return<Dashboard spcb={entries} procurement={procurement} production={production} sales={sales} onLog={()=>setShowSPCB(true)} onProcure={()=>setShowProcure(true)} onProduce={()=>setShowProduce(true)} onSell={()=>setShowSell(true)}/>;
      case"procurement":return<Procurement data={procurement} onAdd={()=>setShowProcure(true)}/>;
      case"production":return<Production data={production} onAdd={()=>setShowProduce(true)}/>;
      case"sales":return<Sales data={sales} onAdd={()=>setShowSell(true)}/>;
      case"spcb":return<SPCBLog entries={entries} onAdd={()=>setShowSPCB(true)}/>;
      case"compliance":return<Compliance entries={entries}/>;
      case"reports":return<Reports entries={entries} procurement={procurement} production={production} sales={sales} mill={mill}/>;
      case"config":return<Config mill={mill} setMill={setMill} pro={isProActive} sb={sb} uid={uid}/>;
      default:return null}};

  const navSections=[{label:"",ids:["dashboard"]},{label:"ERP",ids:["procurement","production","sales"]},{label:"SPCB",ids:["spcb","compliance"]},{label:"",ids:["reports","config"]}];

  return(<div style={{background:C.bg,color:C.text,minHeight:"100vh",fontSize:12}}>
    <StatusBar pro={isProActive} onSecret={()=>setShowSecret(true)} onLogout={async()=>{await sb.auth.signOut();location.reload()}}/>
    <Ticker/>
    {isMobile&&<div style={{display:"flex",overflowX:"auto",background:"#070709",borderBottom:`1px solid ${C.border}`,WebkitOverflowScrolling:"touch"}}>
      {MODS.map(m=><NavBtn key={m.id} m={m}/>)}</div>}
    <div style={{display:"flex",minHeight:"calc(100vh - 72px)"}}>
      {!isMobile&&<div style={{width:168,background:"#070709",borderRight:`1px solid ${C.border}`,padding:"14px 0",flexShrink:0,overflowY:"auto"}}>
        {navSections.map((sec,si)=>(<div key={si}>
          {sec.label&&<div style={{fontSize:8,color:C.steelSoft,letterSpacing:2.5,padding:"10px 18px 4px"}}>{sec.label}</div>}
          {MODS.filter(m=>sec.ids.includes(m.id)).map(m=><NavBtn key={m.id} m={m}/>)}
        </div>))}
        <div style={{padding:"16px 18px",marginTop:16,borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:8,color:C.dim,letterSpacing:2,marginBottom:6}}>MEMBERSHIP</div>
          <div style={{fontSize:10,color:C.steel,letterSpacing:1}}>{isProActive?"PRO":"TRIAL"}</div>
          <div style={{fontSize:8,color:C.label,marginTop:4}}>{isProActive?"Full Mill OS":`${Math.max(0,TRIAL_DAYS-daysUsed)} days left`}</div>
        </div>
      </div>}
      <div style={{flex:1,padding:14,overflow:"hidden",minWidth:0}} className={walled?"blurred":""}>
        <div style={{marginBottom:14}}>
          <h1 style={{fontSize:14,fontWeight:600,letterSpacing:2,color:C.white}}>{MODS.find(m=>m.id===active)?.label}</h1>
          <div style={{fontSize:9,color:C.label,marginTop:4,letterSpacing:1}}>INSPECTOR MILL OS · {mill||"CONFIGURE MILL NAME IN CONFIG"}</div>
        </div>
        {render()}
      </div>
    </div>
    {walled&&<Paywall onUnlock={unlockPro}/>}
    {showSecret&&<SecretEntry onClose={()=>setShowSecret(false)} onUnlock={unlockGod}/>}
    {showSPCB&&<SPCBEntryModal onClose={()=>setShowSPCB(false)} onSave={addSPCB} isMobile={isMobile}/>}
    {showProcure&&<ProcureModal onClose={()=>setShowProcure(false)} onSave={addProcure} isMobile={isMobile}/>}
    {showProduce&&<ProductionModal onClose={()=>setShowProduce(false)} onSave={addProduce} isMobile={isMobile}/>}
    {showSell&&<SalesModal onClose={()=>setShowSell(false)} onSave={addSale} isMobile={isMobile}/>}
  </div>)}

function App(){
  const[session,setSession]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined)return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",color:C.label,fontSize:10,letterSpacing:3}}>INITIALIZING...</div>);
  if(!session)return<AuthGate onAuthed={()=>location.reload()}/>;
  return<INSPECTOR key={session?.user?.id||"app"}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
